<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Contest Publisher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6aecb"/>
      <stop offset="0.55" stop-color="#e891b4"/>
      <stop offset="1" stop-color="#8f7ff0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3e8fb"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9f3"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#6b3f77" flood-opacity="0.28"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5b3a72" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- macOS 图标安全区：1024 画布内 824×824 圆角方块，留出原生边距 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="3"/>

  <g transform="translate(0 12)">
  <!-- 盒子（作品容器）：盒口留出向上提交的开口 -->
  <g filter="url(#soft2)">
    <path d="M300 604 h424 a40 40 0 0 1 40 40 v140 a40 40 0 0 1 -40 40 H300 a40 40 0 0 1 -40 -40 V644 a40 40 0 0 1 40 -40 z" fill="url(#box)"/>
  </g>
  <!-- 盒口内阴影，做出"开口"的深度 -->
  <path d="M292 604 h440 a32 32 0 0 1 32 32 v10 a18 18 0 0 1 -18 18 H278 a18 18 0 0 1 -18 -18 v-10 a32 32 0 0 1 32 -32 z" fill="#c98fd0" opacity="0.28"/>

  <!-- 向上的箭头（提交/发布），从盒中升起 -->
  <g filter="url(#soft)">
    <path d="M512 268 c14 0 27 6 36 17 l128 152 c11 13 1 33 -16 33 h-74 v138 c0 14 -11 25 -25 25 h-98 c-14 0 -25 -11 -25 -25 V470 h-74 c-17 0 -27 -20 -16 -33 l128 -152 c9 -11 22 -17 36 -17 z" fill="url(#arrow)"/>
  </g>

  <!-- 闪光：呼应界面里的柔和高级感 -->
  <path d="M788 236 c6 40 18 52 58 58 c-40 6 -52 18 -58 58 c-6 -40 -18 -52 -58 -58 c40 -6 52 -18 58 -58 z" fill="#ffffff" opacity="0.72"/>
  <path d="M236 300 c4 24 11 31 35 35 c-24 4 -31 11 -35 35 c-4 -24 -11 -31 -35 -35 c24 -4 31 -11 35 -35 z" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
